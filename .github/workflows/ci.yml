name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  actions: read
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install verified Mark
        run: |
          curl -fsSL --retry 3 https://github.com/kovetskiy/mark/releases/download/v16.22.0/mark_Linux_x86_64.tar.gz -o /tmp/mark.tar.gz
          echo "b7a7812f1dc2266d43837028892d6dd1ae38d1b777d8796bb097e1f86da0a3a4  /tmp/mark.tar.gz" | sha256sum -c -
          mkdir /tmp/mark-extract
          tar -xzf /tmp/mark.tar.gz -C /tmp/mark-extract
          sudo install /tmp/mark-extract/mark /usr/local/bin/mark
      - run: npm ci
      - run: npm test
      - run: npm run build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: npm ci
      - run: npm run prepare:windows
      - name: Test with native Windows Mark
        shell: pwsh
        run: |
          $env:MARK_BIN = "$pwd/resources/mark.exe"
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run build
      - name: Check development desktop
        run: npm run smoke:desktop
        env:
          PAGEPORT_SMOKE_DIR: artifacts/windows-development
      - run: npm run package:windows
      - name: Upload unsigned Windows installer for SignPath
        id: upload-unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: pageport-windows-x64-unsigned
          path: release/*-setup.exe
          if-no-files-found: error
      - name: Sign Windows installer with SignPath
        id: signpath
        if: env.SIGNPATH_API_TOKEN != '' && env.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'pageport' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'nsis-installer' }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signed
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
      - name: Use signed Windows installer
        if: steps.signpath.outcome == 'success'
        shell: pwsh
        run: Copy-Item release-signed\*-setup.exe release\ -Force
      - name: Check packaged desktop
        run: node scripts/smoke-desktop.mjs --packaged
        env:
          PAGEPORT_SMOKE_DIR: artifacts/windows-packaged
      - name: Install, verify and uninstall in isolated location
        run: npm run test:windows-installer
        env:
          PAGEPORT_SMOKE_DIR: artifacts/windows-installed
      - uses: actions/upload-artifact@v4
        with:
          name: pageport-windows-x64
          path: release/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-checks
          path: artifacts/windows-*
