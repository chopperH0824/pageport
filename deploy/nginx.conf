# Replace the hostname and certificate paths. Save existing configs before edits.
server {
    listen 80;
    server_name pageport.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name pageport.example.com;
    ssl_certificate /etc/letsencrypt/live/pageport.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pageport.example.com/privkey.pem;
    client_max_body_size 21m;
    location / {
        proxy_pass http://127.0.0.1:18418;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Replace, never append, the client-controlled address header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 180s;
    }
}
