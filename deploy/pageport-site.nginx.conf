# PagePort 官方下载站 Nginx 配置 (pageport.chopperh.me)
# 托管目录: /var/www/pageport
# 安装包目录: /var/www/pageport/downloads/

server {
    listen 80;
    listen [::]:80;
    server_name pageport.chopperh.me;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pageport.chopperh.me;

    ssl_certificate /etc/letsencrypt/live/pageport.chopperh.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pageport.chopperh.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/pageport;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 版本元数据禁止缓存，保证每次发版后官网立即展示最新版本号与 SHA-256
    location = /downloads/latest.json {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # macOS DMG 与 Windows 安装程序直链（开启零拷贝与断点续传）
    location ^~ /downloads/ {
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        output_buffers 2 1m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Accept-Ranges bytes always;
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~* \.(css|js|svg|png|webp|ico)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
